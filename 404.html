@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161D21;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
a:hover { text-decoration-thickness: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
header.top { border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand { font-weight: 700; letter-spacing: .5px; color: var(--ink); text-decoration: none; font-size: 18px; }
nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-size: 15px; }
nav a:hover { color: var(--ink); }
.hero { background: var(--hero); color: var(--hero-ink); padding: 48px 0 52px; }
.hero .wrap { display: flex; gap: 28px; align-items: center; }
.hero img { width: 128px; height: 128px; border-radius: 28px; flex: none; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.hero h1 { margin: 0; font-family: Georgia, "DejaVu Serif", serif; font-size: 44px; line-height: 1.1; }
.hero p { margin: 8px 0 0; color: var(--hero-muted); font-size: 19px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding: 0; list-style: none; }
.pills li { border: 1px solid rgba(239,233,218,.35); border-radius: 999px; padding: 3px 12px; font-size: 14px; color: var(--hero-ink); }
.status { display: inline-block; margin-top: 18px; font-size: 15px; color: var(--hero-muted); }
main { padding: 36px 0 56px; }
h2 { font-family: Georgia, "DejaVu Serif", serif; font-size: 26px; margin: 40px 0 10px; line-height: 1.25; }
h3 { font-size: 18px; margin: 24px 0 6px; }
main > .wrap > h2:first-child { margin-top: 0; }
ul.list { padding-left: 22px; }
ul.list li { margin: 6px 0; }
.card {
  display: flex; gap: 18px; align-items: center; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 14px 0;
}
.card:hover { border-color: var(--accent); }
.card img { width: 72px; height: 72px; border-radius: 16px; flex: none; }
.card strong { font-size: 19px; display: block; }
.card span { color: var(--muted); font-size: 15px; }
.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 12px; padding: 14px 18px; margin: 18px 0; }
.warn strong { color: var(--warn-ink); }
.note { color: var(--muted); font-size: 15px; }
footer { border-top: 1px solid var(--line); padding: 22px 0 32px; color: var(--muted); font-size: 14px; }
footer a { color: var(--muted); }
@media (max-width: 560px) {

  nav a { margin-left: 12px; }
}
